# Railway service configuration for the ActionBrief frontend.
#
# The Dockerfile is the source of truth for the build; Railway only needs to be
# told to use it and how to health-check the result. Set BACKEND_URL to the
# backend service's internal Railway URL (e.g. http://backend.railway.internal:3001).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
