# Railway service configuration for the ActionBrief backend.
#
# The Dockerfile is the source of truth for the build; Railway only needs to be
# told to use it and how to health-check the result.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The image's own ENTRYPOINT/CMD runs migrations then starts the server.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# PDF rendering launches Chromium, which is memory-hungry; one instance keeps
# peak usage predictable. Scale horizontally only after raising the memory limit.
numReplicas = 1
